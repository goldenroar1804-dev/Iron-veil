name: Import CC0 3D environment assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-cc0-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download CC0 GLB models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models/environment
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://www.innerscene.com/api/library/detached-two-storey-house-66774933/download" \
            --output assets/models/environment/suburban_house.glb
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://www.innerscene.com/api/library/sedan-car-42109739/download" \
            --output assets/models/environment/sedan.glb
          for file in assets/models/environment/*.glb; do
            test "$(head -c 4 "$file")" = "glTF"
            test "$(stat -c%s "$file")" -gt 10000
          done

      - name: Commit downloaded models
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/environment/suburban_house.glb assets/models/environment/sedan.glb
          if ! git diff --cached --quiet; then
            git commit -m "Add CC0 detailed house and sedan GLB assets"
            git push
          else
            echo "The asset files are already up to date."
          fi
