name: Godot 4.6 Checks

on:
  push:
    branches:
      - main
      - feature/pve-ai-vr-interactions
  pull_request:
    branches:
      - main
      - feature/pve-ai-vr-interactions
  workflow_dispatch:

jobs:
  godot-check:
    name: Import and Script Checks
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Show Godot Version
        run: godot --version

      - name: Import Project and Check Scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-check.log

      - name: Run Headless Scene Smoke Test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --xr-mode off --path . --quit-after 8 2>&1 | tee godot-runtime.log

      - name: Run PvE Regression Tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --xr-mode off --path . --script res://tests/test_pve_smoke.gd 2>&1 | tee godot-tests.log

      - name: Run Map Collision Regression Tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --xr-mode off --path . --script res://tests/test_map_collisions.gd 2>&1 | tee godot-collisions.log

      - name: Detect Script and Runtime Errors
        if: always()
        shell: bash
        run: |
          failed=0
          for log in godot-check.log godot-runtime.log godot-tests.log godot-collisions.log; do
            if [ -f "$log" ] && grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:|WARNING: Godot 3.x SpatialMaterial remapped parameter not found" "$log"; then
              echo "Godot reported errors in $log."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "No matching Godot errors detected."
