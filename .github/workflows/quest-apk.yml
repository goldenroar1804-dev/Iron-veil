name: Build Iron Veil Quest APK

on:
  push:
    branches:
      - feature/paint-thinner-cqb-map
  workflow_dispatch:

jobs:
  android-apk:
    name: Export Quest APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android export dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot 4.6 editor
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable" /tmp/godot-templates
          curl -L --fail -o /tmp/godot-templates.tpz "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz"
          unzip -oq /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.stable/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Meta Quest debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Meta Quest" build/iron_veil_quest.apk
          test -s build/iron_veil_quest.apk

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: Iron-Veil-Quest-APK
          path: build/iron_veil_quest.apk
          if-no-files-found: error
          retention-days: 14
