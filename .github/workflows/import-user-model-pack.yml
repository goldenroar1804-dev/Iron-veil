name: Import supplied Iron Veil model pack

on:
  push:
    branches:
      - feature/iron-veil-core-rebuild
    paths:
      - "Iron_Veil_Model_Pack.part*"
      - "tools/convert_weapon_assets.py"

permissions:
  contents: write

jobs:
  import-models:
    if: ${{ !contains(github.event.head_commit.message, 'Import supplied soldier and weapon models') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: feature/iron-veil-core-rebuild
          fetch-depth: 0

      - name: Extract supplied models into game asset folders
        shell: bash
        run: |
          set -euo pipefail
          PACK="Iron_Veil_Newest_Branch_Asset_Pack.zip"
          PARTS=(Iron_Veil_Model_Pack.part*)
          test "${#PARTS[@]}" -eq 10
          for i in $(seq -w 1 10); do test -s "Iron_Veil_Model_Pack.part${i}"; done
          cat "${PARTS[@]}" > "$PACK"
          unzip -t "$PACK"
          mkdir -p /tmp/iron-veil-model-pack
          unzip -o "$PACK" "assets/models/characters/military_soldier.glb" -d /tmp/iron-veil-model-pack
          unzip -o "$PACK" "assets/models/weapons/aac_honeybadger.fbx" -d /tmp/iron-veil-model-pack
          unzip -o "$PACK" "assets/models/weapons/glock17_source.blend" -d /tmp/iron-veil-model-pack
          mkdir -p assets/models/characters assets/models/weapons
          cp /tmp/iron-veil-model-pack/assets/models/characters/military_soldier.glb assets/models/characters/
          cp /tmp/iron-veil-model-pack/assets/models/weapons/aac_honeybadger.fbx assets/models/weapons/
          cp /tmp/iron-veil-model-pack/assets/models/weapons/glock17_source.blend assets/models/weapons/
          test "$(head -c 4 assets/models/characters/military_soldier.glb)" = "glTF"
          test "$(stat -c%s assets/models/characters/military_soldier.glb)" -gt 100000
          test "$(stat -c%s assets/models/weapons/aac_honeybadger.fbx)" -gt 10000
          test "$(head -c 7)" = "BLENDER"

      - name: Convert supplied weapon sources to Quest-ready GLB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --background assets/models/weapons/glock17_source.blend --python tools/convert_weapon_assets.py -- assets/models/weapons/glock17_source.blend assets/models/weapons/glock17.glb 0.22
          test "$(head -c 4 assets/models/weapons/glock17.glb)" = "glTF"
          test "$(stat -c%s assets/models/weapons/glock17.glb)" -gt 10000
          rm assets/models/weapons/glock17_source.blend

      - name: Record imported models
        shell: bash
        run: |
          set -euo pipefail
          cat >> LAST_UPDATED.txt <<'EOF'

          2026-11-11 — Supplied 3D model pack imported
          - Added the skinned military soldier GLB for PvE enemy visuals.
          - Added the AAC Honey Badger FBX for direct Godot import as the primary weapon visual.
          - Added the Glock 17 Blender source for later sidearm conversion and integration.
          - Model import is automated from the supplied ZIP; Godot and Quest validation are handled by the project workflows.
          EOF
          rm "Iron_Veil_Newest_Branch_Asset_Pack.zip"
          rm Iron_Veil_Model_Pack.part*

      - name: Commit imported model assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/characters/military_soldier.glb assets/models/weapons/aac_honeybadger.fbx assets/models/weapons/glock17_source.blend assets/models/weapons/glock17.glb LAST_UPDATED.txt
          git add -u -- Iron_Veil_Model_Pack.part*
          if ! git diff --cached --quiet; then
            git commit -m "Import supplied soldier and weapon models"
            git push origin HEAD:feature/iron-veil-core-rebuild
          fi
